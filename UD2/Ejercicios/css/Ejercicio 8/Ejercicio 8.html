<html>
<head>
    <title>Ejercicio de pseudo-clases</title>

    <style>
        li:nth-child(1) {
            color: blue;
            font-size: 16px;
        }

        li:nth-child(2) {
            color: red;
            font-size: 40px;
        }

        li:nth-child(3) {
            color: orange;
            font-size: 26px;
        }

        li:nth-child(4) {
            color: red;
            font-size: 40px;
        }

        li:nth-child(5) {
            color: green;
            font-size: 64px;
        }
    </style>
</head>

<body>
    <ul>
        <li>Primero</li>
        <li>Segundo</li>
        <li>Tercero</li>
        <li>Cuarto</li>
        <li>Quinto</li>
    </ul>
</body>
</html>
