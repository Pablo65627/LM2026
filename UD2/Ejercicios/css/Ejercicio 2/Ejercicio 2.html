<!DOCTYPE html>
<html>
<head>
    <title>Ejercicio 2</title>
    <style>
        body {
            background: pink;
            color: blue;
            font-family: verdana;
            font-size: 20px;
        }

        .centrado {
            text-align: center;
        }

        .plata {
            background: silver;
        }

        .derecha {
            text-align: right;
        }

        span {
            color: red;
        }
    </style>
</head>

<body>

    <p class="centrado">
        Texto <span>centrado.</span>
    </p>

    <p class="centrado plata">
        Texto centrado sobre fondo de color plata.
    </p>

    <p class="derecha">
        Texto <span>alineado</span> a la derecha.
    </p>

    <p class="centrado plata">
        Otro texto centrado sobre fondo de color plata.
    </p>

</body>
</html>
