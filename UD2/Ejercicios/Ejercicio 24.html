<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de incidencia</title>
</head>
<body>

    <form action="incidencia.php" method="get">
        
        <fieldset>
            <legend>Datos del usuario</legend>
            <p>
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="Nombre y apellidos" size="30">
            </p>
            <p>
                <input type="radio" id="alumno" name="tipo_usuario" value="alumno" checked>
                <label for="alumno">Alumno</label>
                <br>
                <input type="radio" id="profesor" name="tipo_usuario" value="profesor">
                <label for="profesor">Profesor</label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Dónde se produce</legend>
            <p>
                <input type="radio" id="todo_departamento" name="lugar" value="todo_departamento">
                <label for="todo_departamento">Todo el departamento</label>
                <br>
                <input type="radio" id="todo_aula" name="lugar" value="todo_aula">
                <label for="todo_aula">Todo el aula</label>
                <br>
                <input type="radio" id="solo_equipo" name="lugar" value="solo_equipo" checked>
                <label for="solo_equipo">Sólo en un equipo</label>
            </p>
            <p>
                <label for="identificacion">Iddentifica el dpto, aula o equipo</label>
                <input type="text" id="identificacion" name="identificacion" size="20">
            </p>
        </fieldset>

        <fieldset>
            <legend>Información sobre la incidencia</legend>
            
            <p>
                <label for="descripcion">Descripción de la incidencia</label>
                <br>
                <textarea id="descripcion" name="descripcion" placeholder="Describe el problema con detalle" cols="60" rows="6"></textarea>
            </p>

            <p>
                <label>Nivel de urgencia:</label>
                <br>
                <input type="radio" id="urgencia_alto" name="urgencia" value="alto">
                <label for="urgencia_alto">Alto</label>
                <br>
                <input type="radio" id="urgencia_medio" name="urgencia" value="medio">
                <label for="urgencia_medio">Medio</label>
                <br>
                <input type="radio" id="urgencia_bajo" name="urgencia" value="bajo" checked>
                <label for="urgencia_bajo">Bajo</label>
            </p>

            <p>
                <label for="aviso_email">Me gustaría ser avisado por email cuando se resuelva la incidencia</label>
                <input type="checkbox" id="aviso_email" name="aviso_email" value="si" checked>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="Entrar">
            <input type="reset" value="Limpiar">
        </p>

    </form>

</body>
</html>
